services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pagewatch
      POSTGRES_USER: pagewatch
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pagewatch}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pagewatch-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagewatch -d pagewatch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pagewatch-data:
